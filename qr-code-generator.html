<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator - Free Online Tools</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:30px auto;padding:16px;color:#172033}
.card{padding:22px;border:1px solid #d8dee9;border-radius:14px;background:#f7fbff}
input,button{font-size:16px;margin-top:10px}
input{width:100%;box-sizing:border-box;padding:12px}
button{padding:12px 18px;background:#087cf0;color:white;border:0;border-radius:8px}
#result{margin-top:20px;text-align:center}
#result img{max-width:100%;height:auto}
#download{display:block;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>QR Code Generator</h1>
<p>Enter text or a website address to create a QR code.</p>
<label for="qrText">Text or website URL</label>
<input id="qrText" type="text" placeholder="https://example.com">
<button id="generate">Generate QR Code</button>
<p id="status" aria-live="polite"></p>
<div id="result"></div>
</div>
<script>
document.getElementById('generate').addEventListener('click', () => {
 const value = document.getElementById('qrText').value.trim();
 const status = document.getElementById('status');
 const result = document.getElementById('result');
 result.replaceChildren();
 if (!value) { status.textContent = 'Please enter text or a website URL.'; return; }
 status.textContent = 'Generating QR code…';
 const img = document.createElement('img');
 img.alt = 'Generated QR code';
 img.width = 260; img.height = 260;
 img.onload = () => {
  status.textContent = '';
  const link = document.createElement('a');
  link.id = 'download'; link.href = img.src; link.download = 'qr-code.png';
  link.textContent = 'Download QR Code';
  result.append(img, link);
 };
 img.onerror = () => {
  status.textContent = 'Could not generate the QR code. Check your internet connection and try again.';
 };
 img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent(value);
});
</script>
</body>
</html>
