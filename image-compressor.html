<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Compressor - Free Online Tools</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:30px auto;padding:16px;color:#172033}
.card{padding:22px;border:1px solid #d8dee9;border-radius:14px;background:#f7fbff}
input,button{font-size:16px;margin-top:10px}
button{padding:12px 18px;background:#087cf0;color:white;border:0;border-radius:8px}
img{max-width:100%;height:auto;margin-top:16px}
#download{display:none;margin-top:14px;display:inline-block}
</style>
</head>
<body>
<div class="card">
<h1>Image Compressor</h1>
<p>Compress an image in your browser. Your image is not uploaded to this website.</p>
<input type="file" id="file" accept="image/*">
<p><label for="quality">Image quality: <span id="qval">70%</span></label><br>
<input type="range" id="quality" min="20" max="95" value="70"></p>
<button id="compress">Compress Image</button>
<p id="status" aria-live="polite"></p>
<img id="preview" alt="Compressed image preview" hidden>
<p><a id="download" download="compressed-image.jpg">Download compressed image</a></p>
</div>
<script>
const quality = document.getElementById('quality');
quality.addEventListener('input', () => document.getElementById('qval').textContent = quality.value + '%');
document.getElementById('compress').addEventListener('click', () => {
 const file = document.getElementById('file').files[0];
 const status = document.getElementById('status');
 if (!file) { status.textContent = 'Please choose an image first.'; return; }
 if (!file.type.startsWith('image/')) { status.textContent = 'Please choose a valid image.'; return; }
 const reader = new FileReader();
 reader.onerror = () => status.textContent = 'Could not read this file. Please try another image.';
 reader.onload = e => {
  const img = new Image();
  img.onerror = () => status.textContent = 'Could not open this image.';
  img.onload = () => {
   const scale = Math.min(1, 2000 / Math.max(img.width, img.height));
   const canvas = document.createElement('canvas');
   canvas.width = Math.max(1, Math.round(img.width * scale));
   canvas.height = Math.max(1, Math.round(img.height * scale));
   canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
   canvas.toBlob(blob => {
    if (!blob) { status.textContent = 'Compression failed. Try another image.'; return; }
    const url = URL.createObjectURL(blob);
    const preview = document.getElementById('preview');
    preview.src = url; preview.hidden = false;
    const link = document.getElementById('download');
    link.href = url; link.style.display = 'inline-block';
    link.textContent = 'Download compressed image (' + (blob.size / 1024).toFixed(1) + ' KB)';
    const saved = file.size ? Math.round((1 - blob.size / file.size) * 100) : 0;
    status.textContent = 'Original: ' + (file.size / 1024).toFixed(1) + ' KB. Compressed: ' + (blob.size / 1024).toFixed(1) + ' KB. ' + (saved > 0 ? saved + '% smaller.' : 'The new file may not be smaller than the original.');
   }, 'image/jpeg', Number(quality.value) / 100);
  };
  img.src = e.target.result;
 };
 reader.readAsDataURL(file);
});
</script>
</body>
</html>
